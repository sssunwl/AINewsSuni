<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AINewsSuni — Steve's Daily AI Brief</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070B14;--bg2:#0D1321;
  --surf:rgba(255,255,255,.04);--surf-h:rgba(255,255,255,.08);
  --bdr:rgba(0,212,255,.14);--bdr-h:rgba(0,212,255,.38);
  --cyan:#00D4FF;--purple:#8B5CF6;--gold:#F59E0B;--green:#10B981;--red:#EF4444;
  --text:#E2E8F0;--muted:#64748B;--sub:#94A3B8;
  --glow:0 0 22px rgba(0,212,255,.22);
  --glow2:0 0 22px rgba(139,92,246,.22);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;line-height:1.6}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}

/* ── HEADER ── */
.hd{
  background:linear-gradient(140deg,#070B14 0%,#0C1220 55%,#080D18 100%);
  border-bottom:1px solid var(--bdr);padding:28px 24px 22px;
  position:relative;overflow:hidden;
}
.hd::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 25% 60%,rgba(0,212,255,.06) 0%,transparent 55%),
             radial-gradient(ellipse at 75% 40%,rgba(139,92,246,.06) 0%,transparent 55%);
  pointer-events:none;
}
.hd-inner{max-width:1080px;margin:0 auto;position:relative}
.logo{
  font-size:24px;font-weight:700;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--cyan) 0%,var(--purple) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo em{font-style:normal;font-weight:300;opacity:.7}
.tagline{font-size:12px;color:var(--sub);margin-top:5px;letter-spacing:.4px}
.live{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.18);
  border-radius:20px;padding:4px 14px;font-size:11px;color:var(--cyan);margin-top:12px;
}
.live::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 8px var(--cyan);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── NAV ── */
.nav-wrap{
  position:sticky;top:0;z-index:100;
  background:rgba(7,11,20,.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);
}
.nav{
  max-width:1080px;margin:0 auto;display:flex;
  overflow-x:auto;scrollbar-width:none;padding:0 24px;
}
.nav::-webkit-scrollbar{display:none}
.ntab{
  flex-shrink:0;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--sub);font-size:13px;font-weight:500;
  padding:14px 18px;cursor:pointer;transition:all .18s;white-space:nowrap;
}
.ntab:hover{color:var(--text)}
.ntab.on{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ── CONTENT ── */
.wrap{max-width:1080px;margin:0 auto;padding:24px}
.pane{display:none}
.pane.on{display:block}

/* Section header */
.sh{display:flex;align-items:center;gap:10px;margin-bottom:18px;margin-top:28px}
.sh:first-child{margin-top:0}
.sh h2{font-size:15px;font-weight:600}
.cnt{
  background:rgba(0,212,255,.09);border:1px solid rgba(0,212,255,.18);
  border-radius:10px;padding:1px 9px;font-size:11px;color:var(--cyan);
}
.section-divider{border:none;border-top:1px solid var(--bdr);margin:28px 0 0}

/* ── CARD GRID ── */
.grid{display:grid;gap:12px}
@media(min-width:680px){.grid.two{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.grid.three{grid-template-columns:repeat(3,1fr)}}

/* Card */
.card{
  background:var(--surf);border:1px solid var(--bdr);border-radius:12px;
  padding:16px 18px;transition:all .18s;position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;width:3px;height:100%;
  background:linear-gradient(180deg,var(--cyan),var(--purple));
  opacity:0;transition:opacity .18s;
}
.card:hover{
  background:var(--surf-h);border-color:var(--bdr-h);
  box-shadow:var(--glow);transform:translateY(-2px);
}
.card:hover::before{opacity:1}
.card.pick{
  background:linear-gradient(135deg,rgba(0,212,255,.07),rgba(139,92,246,.07));
  border-color:rgba(0,212,255,.28);
}
.card.pick:hover{box-shadow:var(--glow),var(--glow2)}

/* Badge */
.meta{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.badge{
  font-size:10px;font-weight:600;letter-spacing:.5px;
  padding:2px 8px;border-radius:4px;text-transform:uppercase;
}
.b-src{background:rgba(139,92,246,.13);color:#A78BFA;border:1px solid rgba(139,92,246,.2)}
.b-tool{background:rgba(16,185,129,.1);color:#34D399;border:1px solid rgba(16,185,129,.2)}
.b-major{background:rgba(245,158,11,.1);color:#FCD34D;border:1px solid rgba(245,158,11,.2)}
.b-sun{background:rgba(0,212,255,.09);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}
.b-pick{background:rgba(139,92,246,.18);color:#C4B5FD;border:1px solid rgba(139,92,246,.3)}
.b-idea{background:rgba(245,158,11,.12);color:#FCD34D;border:1px solid rgba(245,158,11,.25)}

.ctitle{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:6px}
.ctitle a{color:var(--text);transition:color .15s}
.ctitle a:hover{color:var(--cyan);text-decoration:none}
.csub{font-size:12px;color:var(--sub);line-height:1.55}

/* Empty */
.empty{text-align:center;padding:52px 24px;color:var(--muted);font-size:13px}
.empty svg{width:36px;height:36px;margin:0 auto 12px;display:block;opacity:.25}

/* ── PROJECTS ACCORDION ── */
.proj{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color .18s;
}
.proj:hover{border-color:var(--bdr-h)}
.proj.open{border-color:rgba(0,212,255,.3)}
.proj-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px;cursor:pointer;user-select:none;
}
.proj-name{font-size:14px;font-weight:600;color:var(--text)}
.proj-st{font-size:11px;color:var(--sub);margin-top:2px}
.proj-arr{color:var(--muted);font-size:11px;transition:transform .2s;flex-shrink:0;margin-left:12px}
.proj.open .proj-arr{transform:rotate(180deg)}
.proj-body{
  display:none;padding:0 18px 18px;
  border-top:1px solid var(--bdr);
}
.proj.open .proj-body{display:block}
.proj-desc{font-size:12px;color:var(--sub);line-height:1.65;padding-top:14px;margin-bottom:14px}
.proj-links{display:flex;gap:8px;flex-wrap:wrap}
.plink{
  display:inline-flex;align-items:center;gap:5px;
  border-radius:7px;padding:5px 13px;font-size:12px;transition:all .15s;
}
.plink-site{
  background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);color:var(--cyan);
}
.plink-site:hover{background:rgba(0,212,255,.16);border-color:rgba(0,212,255,.4);text-decoration:none}
.plink-gh{
  background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);color:#A78BFA;
}
.plink-gh:hover{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.4);text-decoration:none}

/* ── SUB-TABS (Suniverse) ── */
.stabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.stab{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:20px;padding:6px 18px;font-size:13px;color:var(--sub);
  cursor:pointer;transition:all .18s;
}
.stab:hover{color:var(--text);border-color:var(--bdr-h)}
.stab.on{
  background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.35);color:var(--cyan);
}
.spane{display:none}
.spane.on{display:block}

/* ── CALENDAR ── */
.cal-wrap{max-width:620px;margin:0 auto}
.cal-nav-bar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.cal-title{font-size:16px;font-weight:600;color:var(--text)}
.cal-btn{
  background:var(--surf);border:1px solid var(--bdr);color:var(--sub);
  border-radius:8px;padding:6px 14px;cursor:pointer;font-size:16px;
  transition:all .15s;
}
.cal-btn:hover{border-color:var(--bdr-h);color:var(--cyan)}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  margin-bottom:16px;
}
.cal-dow{
  text-align:center;font-size:11px;color:var(--muted);
  padding:6px 0;font-weight:600;letter-spacing:.5px;
}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;border-radius:8px;font-size:13px;color:var(--sub);
  cursor:default;position:relative;transition:all .15s;
  border:1px solid transparent;
}
.cal-cell.has-data{color:var(--text);cursor:pointer}
.cal-cell.has-data:hover{background:var(--surf-h);border-color:var(--bdr)}
.cal-cell.today{color:var(--cyan);font-weight:700}
.cal-cell.today::after{
  content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--cyan);
}
.cal-cell.selected{background:rgba(0,212,255,.12);border-color:rgba(0,212,255,.35);color:var(--cyan)}
.cal-dot{
  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 6px var(--cyan);
}
.cal-cell.today .cal-dot{background:var(--gold);box-shadow:0 0 6px var(--gold)}

.cal-panel{
  background:var(--surf);border:1px solid var(--bdr);border-radius:12px;
  padding:20px;margin-top:16px;
}
.cal-panel-date{font-size:13px;color:var(--cyan);margin-bottom:16px;font-weight:600}
.cal-item{
  padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);
}
.cal-item:last-child{border-bottom:none}
.cal-item a{color:var(--text);font-size:13px;font-weight:500;line-height:1.4}
.cal-item a:hover{color:var(--cyan);text-decoration:none}
.cal-item .cal-src{font-size:11px;color:var(--muted);margin-top:2px}
.cal-placeholder{
  text-align:center;padding:40px 24px;color:var(--muted);font-size:13px;
}

/* ── AI工具 ── */
.tools-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tfbtn{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:20px;padding:5px 14px;font-size:12px;color:var(--sub);
  cursor:pointer;transition:all .15s;
}
.tfbtn:hover{color:var(--text);border-color:var(--bdr-h)}
.tfbtn.on{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.35);color:var(--cyan)}

.tool-card{
  background:var(--surf);border:1px solid var(--bdr);border-radius:12px;
  padding:16px;transition:all .18s;position:relative;overflow:hidden;
}
.tool-card::before{
  content:'';position:absolute;top:0;left:0;width:3px;height:100%;
  opacity:.6;transition:opacity .18s;
}
.tool-card:hover{background:var(--surf-h);border-color:var(--bdr-h);box-shadow:var(--glow);transform:translateY(-2px)}
.tool-card:hover::before{opacity:1}
.tool-name-en{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px}
.tool-name-zh{font-size:11px;color:var(--sub);margin-bottom:8px}
.tool-desc{font-size:12px;color:var(--sub);line-height:1.55;margin-bottom:12px}
.tool-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tool-cat{font-size:10px;font-weight:600;letter-spacing:.4px;padding:2px 8px;border-radius:4px}
.tool-link{
  font-size:11px;color:var(--cyan);border:1px solid rgba(0,212,255,.2);
  border-radius:6px;padding:3px 10px;transition:all .15s;
}
.tool-link:hover{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.4);text-decoration:none}

/* Category accent colors */
.cat-write::before,.tool-card[data-cat="write"]::before{background:linear-gradient(180deg,#60A5FA,#3B82F6)}
.cat-write{background:rgba(96,165,250,.1);color:#93C5FD;border:1px solid rgba(96,165,250,.2)}
.cat-image::before,.tool-card[data-cat="image"]::before{background:linear-gradient(180deg,#F472B6,#EC4899)}
.cat-image{background:rgba(244,114,182,.1);color:#F9A8D4;border:1px solid rgba(244,114,182,.2)}
.cat-video::before,.tool-card[data-cat="video"]::before{background:linear-gradient(180deg,#FB923C,#F97316)}
.cat-video{background:rgba(251,146,60,.1);color:#FCA59A;border:1px solid rgba(251,146,60,.2)}
.cat-audio::before,.tool-card[data-cat="audio"]::before{background:linear-gradient(180deg,#A78BFA,#8B5CF6)}
.cat-audio{background:rgba(167,139,250,.1);color:#C4B5FD;border:1px solid rgba(167,139,250,.2)}
.cat-code::before,.tool-card[data-cat="code"]::before{background:linear-gradient(180deg,#34D399,#10B981)}
.cat-code{background:rgba(52,211,153,.1);color:#6EE7B7;border:1px solid rgba(52,211,153,.2)}
.cat-search::before,.tool-card[data-cat="search"]::before{background:linear-gradient(180deg,#FCD34D,#F59E0B)}
.cat-search{background:rgba(252,211,77,.1);color:#FDE68A;border:1px solid rgba(252,211,77,.2)}
.cat-social::before,.tool-card[data-cat="social"]::before{background:linear-gradient(180deg,#F87171,#EF4444)}
.cat-social{background:rgba(248,113,113,.1);color:#FCA5A5;border:1px solid rgba(248,113,113,.2)}
.cat-productivity::before,.tool-card[data-cat="productivity"]::before{background:linear-gradient(180deg,#00D4FF,#0EA5E9)}
.cat-productivity{background:rgba(0,212,255,.09);color:var(--cyan);border:1px solid rgba(0,212,255,.2)}

/* Coming soon */
.coming-soon{
  text-align:center;padding:64px 24px;color:var(--muted);
}
.coming-soon .cs-icon{font-size:40px;margin-bottom:16px}
.coming-soon h3{font-size:15px;color:var(--sub);margin-bottom:8px}
.coming-soon p{font-size:12px}

/* ── FOOTER ── */
.footer{
  text-align:center;padding:32px 24px;
  border-top:1px solid var(--bdr);color:var(--muted);font-size:12px;margin-top:40px;
}
.footer a{color:var(--cyan)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:2px}
</style>
</head>

<script>
// ── Main Tab ──
document.querySelectorAll('.ntab').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.ntab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('tab-'+b.dataset.tab).classList.add('on');
  });
});

// ── Sub-Tab (Suniverse) ──
document.querySelectorAll('.stab').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.spane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('stab-'+b.dataset.stab).classList.add('on');
  });
});

// ── Calendar ──
const MONTH_NAMES=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const DOW=['一','二','三','四','五','六','日'];
let calYear, calMonth, calData={}, selectedDate=null;

function pad(n){return String(n).padStart(2,'0')}
function dateKey(y,m,d){return`${y}-${pad(m+1)}-${pad(d)}`}

function renderCal(){
  const today=new Date();
  document.getElementById('calTitle').textContent=`${calYear} 年 ${MONTH_NAMES[calMonth]}`;

  const firstDow=(new Date(calYear,calMonth,1).getDay()+6)%7;
  const lastDay=new Date(calYear,calMonth+1,0).getDate();
  let cells='';
  DOW.forEach(d=>{cells+=`<div class="cal-dow">${d}</div>`});
  for(let i=0;i<firstDow;i++) cells+=`<div class="cal-cell"></div>`;
  for(let d=1;d<=lastDay;d++){
    const key=dateKey(calYear,calMonth,d);
    const isToday=calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate();
    const has=!!calData[key];
    const isSel=selectedDate===key;
    const cls=['cal-cell',isToday?'today':'',has?'has-data':'',isSel?'selected':''].filter(Boolean).join(' ');
    const dot=has?`<span class="cal-dot"></span>`:'';
    cells+=`<div class="${cls}" onclick="selectCal('${key}')">${d}${dot}</div>`;
  }
  document.getElementById('calGrid').innerHTML=cells;
  renderCalPanel();
}

function selectCal(key){
  if(!calData[key]) return;
  selectedDate=selectedDate===key?null:key;
  renderCal();
}

function renderCalPanel(){
  const panel=document.getElementById('calPanel');
  if(!selectedDate||!calData[selectedDate]){
    panel.innerHTML=`<div class="cal-placeholder">選擇日期，查看當天 AI 簡報</div>`;
    return;
  }
  const day=calData[selectedDate];
  const news=[...(day.news||[])].slice(0,6);
  panel.innerHTML=`<div class="cal-panel">
    <div class="cal-panel-date">📅 ${selectedDate} 當日 AI 簡報</div>
    ${news.length?news.map(n=>`<div class="cal-item">
      <a href="${n.link}" target="_blank" rel="noopener">${esc(n.title)}</a>
      <div class="cal-src">${esc(n.source||'')}</div>
    </div>`).join(''):'<div style="color:var(--muted);font-size:13px">暫無記錄</div>'}
    ${day.pick?`<div class="cal-item" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,212,255,.1)">
      <div style="font-size:11px;color:var(--cyan);margin-bottom:4px">💡 Steve 精選</div>
      <a href="${day.pick.link}" target="_blank" rel="noopener">${esc(day.pick.title)}</a>
    </div>`:''}
    ${day.steve_ideas&&day.steve_ideas.length?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(245,158,11,.15)">
      <div style="font-size:11px;color:var(--gold);margin-bottom:8px;font-weight:600">💰 Steve 今日賺錢機會</div>
      ${day.steve_ideas.map((idea,i)=>`<div style="margin-bottom:10px">
        <div style="font-size:12px;font-weight:600;color:var(--text)">${['1️⃣','2️⃣','3️⃣'][i]} ${esc(idea.title)}</div>
        <div style="font-size:11px;color:var(--sub);margin-top:2px">${esc(idea.detail)}</div>
      </div>`).join('')}
    </div>`:''}
  </div>`;
}

document.getElementById('calPrev').addEventListener('click',()=>{
  calMonth--;if(calMonth<0){calMonth=11;calYear--}
  selectedDate=null;renderCal();
});
document.getElementById('calNext').addEventListener('click',()=>{
  calMonth++;if(calMonth>11){calMonth=0;calYear++}
  selectedDate=null;renderCal();
});

    if(d.updated){
      const todayKey=d.updated.split(' ')[0];
      if(todayKey&&!calData[todayKey]){
        calData[todayKey]={news:d.news,tools:d.tools,suniverse_news:d.suniverse_news,major:d.major,pick:d.pick};
      }
    }
    const now=new Date();
    calYear=now.getFullYear();calMonth=now.getMonth();
    renderCal();
  })
  .catch(()=>{
    document.getElementById('liveTag').textContent='資料載入失敗，請稍後重試';
    const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();
    renderCal();
